# YangSpace 2.0: documentation gate only until M0 security/build remediation.
# Intentionally NO deploy credentials, NO Azure, NO IIS, NO Jenkins.
name: YangSpace baseline checks (no deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check baseline files and links
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            docs/PRODUCT.md
            docs/ARCHITECTURE.md
            docs/DOMAIN_MODEL.md
            docs/MVP_ROADMAP.md
            docs/PVE_OPERATIONS.md
            docs/SECURITY_BASELINE.md
            docs/VALIDATION.md
            docs/DECISIONS.md
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing/empty: $file"; exit 1; }
          done
          if git grep -n -E '^[[:space:]]*uses:[[:space:]]*azure/webapps-deploy|^[[:space:]]*run:.*appcmd' -- .github/workflows; then
            echo "Legacy deployment command found in active workflows"
            exit 1
          fi
          echo "YangSpace docs and deployment-safety gate PASS"
      - name: Runtime build is explicitly deferred to M0
        run: |
          echo "Legacy .NET 8 / Angular 18 source has known issues."
          echo "Full build/tests must be re-enabled as a required gate before deployment."
