# YangSpace 2.0: CI only. NEVER deploy to Azure, PVE, IIS or any production host.
name: YangSpace v2 - API and Angular validation
on:
  push:
    branches: [main, feat/yangspace-v2-foundation-20261108]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build .NET 10
        run: |
          dotnet restore apps/api/YangSpace.Api.csproj -warnaserror
          dotnet list apps/api/YangSpace.Api.csproj package --include-transitive | tee /tmp/yangspace-packages.txt
          grep -E "SQLitePCLRaw.lib.e_sqlite3[[:space:]]+3[.]53[.]3" /tmp/yangspace-packages.txt
          dotnet build apps/api/YangSpace.Api.csproj -c Release --no-restore -warnaserror
      - name: Start isolated preview API, smoke and real DB integration
        shell: bash
        run: |
          set -Eeuo pipefail
          export ASPNETCORE_ENVIRONMENT=Staging
          export ASPNETCORE_URLS=http://127.0.0.1:5090
          export Preview__Enabled=true
          export ConnectionStrings__Main='Data Source=/tmp/yangspace-ci-integration.db'
          export Bootstrap__AdminEmail='ci-admin@example.invalid'
          export Bootstrap__AdminPassword="Aa!1$(openssl rand -hex 24)"
          export YANGSPACE_TEST_DB_PATH=/tmp/yangspace-ci-integration.db
          export YANGSPACE_TEST_STATE=/tmp/yangspace-ci-state.json
          export YANGSPACE_TEST_ISOLATED_DB=YES
          rm -f /tmp/yangspace-ci-integration.db /tmp/yangspace-ci-integration.db-shm /tmp/yangspace-ci-integration.db-wal /tmp/yangspace-ci-state.json
          pid=''
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            tail -n 70 /tmp/yangspace-api.log || true
          }
          trap cleanup EXIT
          start_api() {
            dotnet apps/api/bin/Release/net10.0/YangSpace.Api.dll > /tmp/yangspace-api.log 2>&1 &
            pid=$!
            for i in {1..40}; do
              if curl -fsS http://127.0.0.1:5090/health/ready >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "API readiness timeout" >&2
            return 1
          }
          start_api
          bash scripts/api-smoke.sh
          python3 scripts/api-integration.py prepare
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          pid=''
          # A direct dotnet DLL process has a stable PID; prove it stopped.
          if curl -fsS --max-time 2 http://127.0.0.1:5090/health/ready >/dev/null 2>&1; then
            echo "API_PROCESS_RESTART_NOT_VERIFIED" >&2
            exit 1
          fi
          start_api
          python3 scripts/api-integration.py verify
          echo "REAL_API_INTEGRATION=PASS"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Verify source-tracked lockfile
        working-directory: apps/web
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s package-lock.json
          git -C ../.. ls-files --error-unmatch apps/web/package-lock.json >/dev/null
          node scripts/verify-lock.mjs
          echo "LOCKFILE_TRACKED=PASS"
      - name: Install exactly locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Dependency advisory gate
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Check deploy output
        run: test -s apps/web/dist/yangspace-web/browser/index.html
      - name: Install Playwright Chromium (CI only)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser regression and viewport audit
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yangspace-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against reintroducing legacy pipelines
        shell: bash
        run: |
          set -euo pipefail
          test ! -f Jenkinsfile
          test -s README.md
          test -s infra/pve/README.md
          test -s apps/api/YangSpace.Api.csproj
          test -s apps/web/package.json
          if git grep -n -E '^[[:space:]]*uses:[[:space:]]*azure/webapps-deploy|^[[:space:]]*run:[[:space:]]*appcmd' -- .github/workflows; then
            echo "Legacy deployment step detected." >&2; exit 1
          fi
          echo "No auto-deploy targets configured."
