# YangSpace 2.0: CI only. NEVER deploy to Azure, PVE, IIS or any production host.
name: YangSpace v2 - API and Angular validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build .NET 10
        run: |
          dotnet restore apps/api/YangSpace.Api.csproj -warnaserror
          dotnet list apps/api/YangSpace.Api.csproj package --include-transitive | tee /tmp/yangspace-packages.txt
          grep -E "SQLitePCLRaw.lib.e_sqlite3[[:space:]]+3[.]53[.]3" /tmp/yangspace-packages.txt
          dotnet build apps/api/YangSpace.Api.csproj -c Release --no-restore -warnaserror
      - name: Start isolated preview API and smoke
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          ASPNETCORE_URLS: http://127.0.0.1:5090
          Preview__Enabled: 'true'
          ConnectionStrings__Main: Data Source=/tmp/yangspace-ci.db
        run: |
          set -euo pipefail
          dotnet run --no-launch-profile --no-build -c Release --project apps/api/YangSpace.Api.csproj > /tmp/yangspace-api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; tail -n 50 /tmp/yangspace-api.log' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5090/health/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          bash scripts/api-smoke.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Bootstrap Angular dependencies (lockfile pending)
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Check deploy output
        run: test -s apps/web/dist/yangspace-web/browser/index.html
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against reintroducing legacy pipelines
        shell: bash
        run: |
          set -euo pipefail
          test ! -f Jenkinsfile
          test -s README.md
          test -s infra/pve/README.md
          test -s apps/api/YangSpace.Api.csproj
          test -s apps/web/package.json
          if grep -R -nE '^[[:space:]]*uses:[[:space:]]*azure/webapps-deploy|appcmd stop|appcmd start' .github/workflows; then
            echo "Legacy deployment step detected." >&2; exit 1
          fi
          echo "No auto-deploy targets configured."
