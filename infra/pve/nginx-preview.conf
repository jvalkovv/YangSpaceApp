# Example: Nginx inside LXC, reachable ONLY from an authenticated TLS gateway/VPN.
# Do not expose this HTTP listener publicly; replace server_name when provisioning.
server {
    listen 80;
    server_name yangspace-preview.example.invalid;
    server_tokens off;
    root /srv/yangspace/current/web/browser;
    index index.html;
    client_max_body_size 2m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
    location /health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
